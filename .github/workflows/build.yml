name: Build Windows desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test backend and renderer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Install Node dependencies
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Backend tests
        run: python -m pytest backend/tests -q
      - name: TypeScript check
        run: npm run typecheck
      - name: Build renderer
        run: npm run build

  package:
    name: Package installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Build embedded Python runtime
        run: npm run build:runtime
      - name: Build renderer
        run: npm run build
      - name: Package NSIS installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $exe = Get-ChildItem release\*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer produced" }
          "$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)  $($exe.Name)" | Out-File release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lumen-studio-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
